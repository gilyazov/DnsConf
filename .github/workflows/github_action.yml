
name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply changes to NextDNS"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DNS

    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate filtered hosts
        run: |
          python3 filter_hosts.py
          wc -l filtered-hosts
          grep -E ' (chatgpt\.com|auth\.openai\.com)$' filtered-hosts

      - name: Upload generated hosts
        uses: actions/upload-artifact@v4
        with:
          name: filtered-hosts
          path: filtered-hosts
          retention-days: 30
          if-no-files-found: error

      - name: Verify and backup NextDNS
        env:
          APPLY_CLEANUP: "false"
        run: python3 cleanup_nextdns.py

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: nextdns-rewrites-backup
          path: rewrites-backup.json
          retention-days: 30
          if-no-files-found: error

      - name: Synchronize NextDNS
        if: >-
          ${{
            github.event_name == 'schedule' ||
            inputs.apply_changes == true
          }}
        env:
          APPLY_CLEANUP: "true"
          CONFIRM_PROFILE: ${{ secrets.CLIENT_ID }}
        run: python3 cleanup_nextdns.py
