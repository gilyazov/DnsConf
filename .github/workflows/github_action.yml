
name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Generate filtered hosts
        run: |
          python3 filter_hosts.py
          echo "Filtered hosts:"
          cat filtered-hosts
          echo "Total records:"
          wc -l filtered-hosts

      - name: Publish filtered hosts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add filtered-hosts

          if ! git diff --cached --quiet; then
            git commit -m "Update filtered DNS hosts"
            git push
          else
            echo "No DNS changes"
          fi

      - name: Run application
        env:
          REDIRECT: https://raw.githubusercontent.com/${{ github.repository }}/main/filtered-hosts
        run: |
          echo "Starting NextDNS update..."
          java --enable-preview -jar target/*.jar
